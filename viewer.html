<script data-page-node-id="ne0rknAZohxSJnM83tbgOr" data-pnid-children="WEAoTdmumswWEuhME5FUyZ" type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ---------------- 基础场景 ---------------- */
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f2f5);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
camera.position.set(3, 2.5, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b6bd, 1.1));
const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(5, 8, 6);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.6);
dir2.position.set(-6, 3, -5);
scene.add(dir2);

const grid = new THREE.GridHelper(20, 40, 0xc9ced6, 0xdfe3e8);
scene.add(grid);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 模型加载 ---------------- */
const overlay = document.getElementById("overlay");
const msg = document.getElementById("msg");
const spinner = document.getElementById("spinner");
const modelName = document.getElementById("modelName");

let modelRoot = null;          // gltf.scene
let explodeParts = [];         // 每个网格的爆炸信息
let explodeFactor = 0;
let modelRadius = 1;
let pickMeshes = [];           // 可点击查询的板件
let selectedMesh = null;
let selectedOrigEmissive = null;
let camDist = 3;               // 相机适配距离（正视按钮用）

function hideOverlay() { overlay.classList.add("hidden"); }

function setupModel(scene3d, name) {
  clearSelection();
  infoCard.classList.remove("show");
  if (modelRoot) {
    scene.remove(modelRoot);
    modelRoot.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
      }
    });
  }
  modelRoot = scene3d;
  scene.add(modelRoot);

  // 计算包围盒与相机适配
  const box = new THREE.Box3().setFromObject(modelRoot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  modelRadius = size.length() / 2 || 1;

  // 把模型中心移到原点上方，方便旋转
  modelRoot.position.set(-center.x, -box.min.y, -center.z);
  modelRoot.updateMatrixWorld(true);

  // 相机适配（默认视角偏正面，接近 SketchUp 正视图 + 少许高度）
  camDist = modelRadius / Math.sin((camera.fov * Math.PI / 180) / 2) * 1.15;
  camera.position.set(camDist * 0.55, camDist * 0.22, camDist * 0.95);
  controls.target.set(0, (size.y / 2) * 0.8, 0);
  controls.update();

  // 收集爆炸信息：每个网格按「自身中心 - 模型整体中心」方向飞出
  explodeParts = [];
  const worldCenter = new THREE.Vector3();
  let idx = 0;
  pickMeshes = [];
  modelRoot.traverse(obj => {
    // 隐藏模型文件里自带的线框 / 点（拆单导出常带边线，看着杂乱）
    if (obj.isLine || obj.isLineSegments || obj.isPoints) { obj.visible = false; return; }
    if (obj.isMesh) {
      obj.userData.partName = pickPartName(obj);
      obj.userData.cabinet = cabinetOf(obj);
      const b = new THREE.Box3().setFromObject(obj);
      const mc = b.getCenter(new THREE.Vector3());
      // 注意：modelRoot 已平移到原点，整体中心即原点上方 size.y/2
      const totalCenter = new THREE.Vector3(0, (box.max.y - box.min.y) / 2, 0);
      let dirWorld = mc.clone().sub(totalCenter);
      // 太靠近中心的零件给一个伪随机方向，保证也能炸开
      if (dirWorld.length() < modelRadius * 0.05) {
        const angle = idx * 2.39996; // 黄金角，分布均匀
        dirWorld = new THREE.Vector3(Math.cos(angle), 0.25, Math.sin(angle));
      }
      dirWorld.normalize();

      // 转换到父节点局部坐标
      const parentQuat = obj.parent.getWorldQuaternion(new THREE.Quaternion()).invert();
      const dirLocal = dirWorld.clone().applyQuaternion(parentQuat);

      explodeParts.push({
        mesh: obj,
        basePos: obj.position.clone(),
        dirLocal: dirLocal,
        scale: modelRadius * 0.9 + (idx % 5) * modelRadius * 0.12 // 分层飞出，层次感更强
      });
      pickMeshes.push(obj);
      idx++;
    }
  });

  modelName.textContent = name || "3D 模型";
  buildCabinetBar();
  document.getElementById("explodeVal").textContent = Math.round(explodeFactor * 100) + "%";
  updateSliderFill();
}

/* ---------------- 柜体识别与选择 ---------------- */
let selectedCabinet = null;    // null = 全部柜体

// 找网格所属的柜体：往上找「直接挂在模型根部下」的节点名
function cabinetOf(obj) {
  let o = obj;
  while (o.parent && o.parent !== modelRoot) o = o.parent;
  if (o && o !== modelRoot && o.name) return o.name;
  return "未分组";
}

const cabBar = document.getElementById("cabBar");
function buildCabinetBar() {
  const names = [];
  pickMeshes.forEach(m => {
    const c = m.userData.cabinet || "未分组";
    if (!names.includes(c)) names.push(c);
  });
  if (names.length < 2) {           // 只有一个柜体时不显示选择栏
    cabBar.classList.remove("show");
    selectedCabinet = null;
    return;
  }
  cabBar.innerHTML = "";
  const mk = (label, val) => {
    const b = document.createElement("button");
    b.className = "chip" + ((selectedCabinet === val) ? " on" : "");
    b.textContent = label;
    b.addEventListener("click", () => {
      selectedCabinet = val;
      cabBar.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      b.classList.add("on");
      applyCabinetFilter();
      applyExplode();
    });
    return b;
  };
  cabBar.appendChild(mk("全部", null));
  names.forEach(n => cabBar.appendChild(mk(n, n)));
  cabBar.classList.add("show");
}

// 选中的柜体正常显示并参与爆炸，其余变半透明且不参与爆炸
function applyCabinetFilter() {
  for (const p of explodeParts) {
    const m = p.mesh;
    const active = !selectedCabinet || m.userData.cabinet === selectedCabinet;
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    mats.forEach(mat => {
      mat.transparent = true;
      mat.opacity = active ? 1.0 : 0.12;
      mat.depthWrite = active;
    });
  }
}

function applyExplode() {
  for (const p of explodeParts) {
    if (selectedCabinet && p.mesh.userData.cabinet !== selectedCabinet) {
      p.mesh.position.copy(p.basePos); // 其他柜体复位不动
      continue;
    }
    p.mesh.position.copy(p.basePos).addScaledVector(p.dirLocal, explodeFactor * p.scale);
  }
}

const loader = new GLTFLoader();
function loadURL(url) {
  msg.innerHTML = "正在加载模型…";
  spinner.style.display = "block";
  loader.load(
    url,
    (gltf) => {
      setupModel(gltf.scene, decodeURIComponent(url.split("/").pop().split("?")[0]) || "3D 模型");
      hideOverlay();
    },
    (xhr) => {
      if (xhr.total) msg.innerHTML = "正在加载模型… " + Math.round((xhr.loaded / xhr.total) * 100) + "%";
    },
    (error) => {
      spinner.style.display = "none";
      msg.innerHTML = '<span class="err">模型加载失败</span><br>' +
        "请检查链接是否正确，以及文件所在服务器是否允许跨域访问（CORS）。" +
        "<br><small>错误信息：" + (error && error.message ? error.message : error) + "</small>";
    }
  );
}

function loadFile(file) {
  const name = file.name;
  msg.innerHTML = "正在加载本地文件…";
  spinner.style.display = "block";
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const loader2 = new GLTFLoader();
      loader2.parse(fr.result, "", (gltf) => {
        setupModel(gltf.scene, name);
        hideOverlay();
      }, (e) => {
        spinner.style.display = "none";
        msg.innerHTML = '<span class="err">文件解析失败</span><br>请确认是 .glb 或 .gltf 格式';
      });
    } catch (e) {
      spinner.style.display = "none";
      msg.innerHTML = '<span class="err">文件解析失败</span>';
    }
  };
  fr.readAsArrayBuffer(file);
}

/* ---------------- 点击板件查询 ---------------- */
const infoCard = document.getElementById("info");
const infoName = document.getElementById("infoName");
const infoMeta = document.getElementById("infoMeta");
document.getElementById("infoClose").addEventListener("click", () => {
  clearSelection();
  infoCard.classList.remove("show");
});

// 从网格或其祖先链上找有意义的节点名
function pickPartName(obj) {
  let o = obj;
  for (let i = 0; i < 6 && o; i++) {
    const n = (o.name || "").trim();
    if (n && n !== "Scene" && !/^part_\d+$/i.test(n) && !/^(root|node)\b/i.test(n)) return n;
    o = o.parent;
  }
  return "未命名板件";
}

function clearSelection() {
  if (selectedMesh && selectedMesh.material) {
    const mats = Array.isArray(selectedMesh.material) ? selectedMesh.material : [selectedMesh.material];
    mats.forEach((m, i) => {
      if (m.emissive && selectedOrigEmissive) {
        const orig = Array.isArray(selectedOrigEmissive) ? selectedOrigEmissive[i] : selectedOrigEmissive;
        m.emissive.copy(orig);
      }
    });
  }
  selectedMesh = null;
  selectedOrigEmissive = null;
}

function showInfo(mesh) {
  clearSelection();
  selectedMesh = mesh;
  // 高亮：给材质加自发光
  if (mesh.material) {
    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    selectedOrigEmissive = mats.map(m => (m.emissive ? m.emissive.clone() : null));
    mats.forEach(m => { if (m.emissive) m.emissive.setHex(0x8a2a18); });
  }
  // 尺寸（模型单位是米，转毫米显示）
  const box = new THREE.Box3().setFromObject(mesh);
  const size = box.getSize(new THREE.Vector3());
  const mm = [size.x, size.y, size.z].map(v => Math.round(v * 1000));
  infoName.textContent = mesh.userData.partName || "未命名板件";
  const cab = mesh.userData.cabinet || "未分组";
  infoMeta.textContent = "所属：" + cab + " · 尺寸：" + mm[0] + " × " + mm[1] + " × " + mm[2] + " mm";
  infoCard.classList.add("show");
}

const raycaster = new THREE.Raycaster();
let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  downX = e.clientX; downY = e.clientY; downT = Date.now();
});
renderer.domElement.addEventListener("pointerup", (e) => {
  // 只在"轻点"（没怎么移动、时间短）时触发查询，避免和旋转手势冲突
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 8 || Date.now() - downT > 350) return;
  if (!pickMeshes.length) return;
  const ndc = new THREE.Vector2(
    (e.clientX / innerWidth) * 2 - 1,
    -(e.clientY / innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickMeshes, false);
  if (hits.length) {
    showInfo(hits[0].object);
  } else {
    clearSelection();
    infoCard.classList.remove("show");
  }
});

/* ---------------- 控件 ---------------- */
const slider = document.getElementById("explode");
const explodeVal = document.getElementById("explodeVal");

function updateSliderFill() {
  slider.style.setProperty("--fill", slider.value + "%");
}
slider.addEventListener("input", () => {
  explodeFactor = slider.value / 100;
  explodeVal.textContent = slider.value + "%";
  updateSliderFill();
  applyExplode();
});

document.getElementById("btnReset").addEventListener("click", () => {
  slider.value = 0;
  explodeFactor = 0;
  explodeVal.textContent = "0%";
  updateSliderFill();
  applyExplode();
  if (modelRoot) controls.target.set(0, modelRadius * 0.4, 0);
});

// 视角切换：正视 / 后视 / 左视 / 右视 / 俯视
// （模型正面朝 +Z，Y 轴朝上；坐标是相对适配距离的相机位置比例）
function setView(px, py, pz) {
  if (!modelRoot) return;
  camera.position.set(camDist * px, camDist * py, camDist * pz);
  controls.target.set(0, modelRadius * 0.4, 0);
  controls.update();
  spinning = false;
  btnSpin.classList.remove("on");
}
document.getElementById("viewFront").addEventListener("click", () => setView(0.03, 0.05, 1.0));
document.getElementById("viewBack").addEventListener("click",  () => setView(-0.03, 0.05, -1.0));
document.getElementById("viewLeft").addEventListener("click",  () => setView(-1.0, 0.05, 0.03));
document.getElementById("viewRight").addEventListener("click", () => setView(1.0, 0.05, 0.03));
document.getElementById("viewTop").addEventListener("click",   () => setView(0.03, 1.0, 0.03));

let spinning = false;
const btnSpin = document.getElementById("btnSpin");
btnSpin.addEventListener("click", () => {
  spinning = !spinning;
  btnSpin.classList.toggle("on", spinning);
});

let gridOn = true;
const btnGrid = document.getElementById("btnGrid");
btnGrid.classList.add("on");
btnGrid.addEventListener("click", () => {
  gridOn = !gridOn;
  grid.visible = gridOn;
  btnGrid.classList.toggle("on", gridOn);
});

/* 拖拽本地文件 */
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && /\.(glb|gltf)$/i.test(file.name)) loadFile(file);
});

/* ---------------- 渲染循环 ---------------- */
renderer.setAnimationLoop(() => {
  if (spinning && modelRoot) modelRoot.rotation.y += 0.005;
  controls.update();
  renderer.render(scene, camera);
});

/* ---------------- 入口：?model=参数 ---------------- */
const params = new URLSearchParams(location.search);
const modelUrl = params.get("model");
if (modelUrl) {
  loadURL(modelUrl);
} else {
  spinner.style.display = "none";
  msg.innerHTML = "提示：在网址后加 <b>?model=模型文件地址</b><br>即可自动加载线上 GLB 模型，例如：<br><small>?model=https://xxx.com/model.glb</small>";
}
</script>
