  /* 加载 / 错误提示 */
  #overlay {

<script data-page-node-id="mrF8sd6ud42IarymzU7kHx" data-pnid-children="7zGgGfySdrXMM4v1qqijgI" type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

<script data-page-node-id="Ylto7gZXFUkl88YwZHakz5" data-pnid-children="YeUCjZdGCbo3IIvIJQggUS" type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ---------------- 基础场景 ---------------- */
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f2f5);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
camera.position.set(3, 2.5, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b6bd, 1.1));
const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(5, 8, 6);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.6);
dir2.position.set(-6, 3, -5);
scene.add(dir2);

const grid = new THREE.GridHelper(20, 40, 0xc9ced6, 0xdfe3e8);
scene.add(grid);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 模型加载 ---------------- */
const overlay = document.getElementById("overlay");
const msg = document.getElementById("msg");
const spinner = document.getElementById("spinner");
const modelName = document.getElementById("modelName");

let modelRoot = null;          // gltf.scene
let explodeParts = [];         // 每个网格的爆炸信息
let explodeFactor = 0;
let modelRadius = 1;

function hideOverlay() { overlay.classList.add("hidden"); }

function setupModel(scene3d, name) {
  if (modelRoot) {
    scene.remove(modelRoot);
    modelRoot.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
      }
    });
  }
  modelRoot = scene3d;
  scene.add(modelRoot);

  // 计算包围盒与相机适配
  const box = new THREE.Box3().setFromObject(modelRoot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  modelRadius = size.length() / 2 || 1;

  // 把模型中心移到原点上方，方便旋转
  modelRoot.position.set(-center.x, -box.min.y, -center.z);
  modelRoot.updateMatrixWorld(true);

  // 相机适配
  const dist = modelRadius / Math.sin((camera.fov * Math.PI / 180) / 2) * 1.15;
  camera.position.set(dist * 0.75, dist * 0.55, dist * 0.85);
  controls.target.set(0, (size.y / 2) * 0.8, 0);
  controls.update();

  // 收集爆炸信息：每个网格按「自身中心 - 模型整体中心」方向飞出
  explodeParts = [];
  const worldCenter = new THREE.Vector3();
  let idx = 0;
  modelRoot.traverse(obj => {
    if (obj.isMesh) {
      const b = new THREE.Box3().setFromObject(obj);
      const mc = b.getCenter(new THREE.Vector3());
      // 注意：modelRoot 已平移到原点，整体中心即原点上方 size.y/2
      const totalCenter = new THREE.Vector3(0, (box.max.y - box.min.y) / 2, 0);
      let dirWorld = mc.clone().sub(totalCenter);
      // 太靠近中心的零件给一个伪随机方向，保证也能炸开
      if (dirWorld.length() < modelRadius * 0.05) {
        const angle = idx * 2.39996; // 黄金角，分布均匀
        dirWorld = new THREE.Vector3(Math.cos(angle), 0.25, Math.sin(angle));
      }
      dirWorld.normalize();

      // 转换到父节点局部坐标
      const parentQuat = obj.parent.getWorldQuaternion(new THREE.Quaternion()).invert();
      const dirLocal = dirWorld.clone().applyQuaternion(parentQuat);

      explodeParts.push({
        mesh: obj,
        basePos: obj.position.clone(),
        dirLocal: dirLocal,
        scale: modelRadius * 0.9 + (idx % 5) * modelRadius * 0.12 // 分层飞出，层次感更强
      });
      idx++;
    }
  });

  modelName.textContent = name || "3D 模型";
  document.getElementById("explodeVal").textContent = Math.round(explodeFactor * 100) + "%";
  updateSliderFill();
}

function applyExplode() {
  for (const p of explodeParts) {
    p.mesh.position.copy(p.basePos).addScaledVector(p.dirLocal, explodeFactor * p.scale);
  }
}

const loader = new GLTFLoader();
function loadURL(url) {
  msg.innerHTML = "正在加载模型…";
  spinner.style.display = "block";
  loader.load(
    url,
    (gltf) => {
      setupModel(gltf.scene, decodeURIComponent(url.split("/").pop().split("?")[0]) || "3D 模型");
      hideOverlay();
    },
    (xhr) => {
      if (xhr.total) msg.innerHTML = "正在加载模型… " + Math.round((xhr.loaded / xhr.total) * 100) + "%";
    },
    (error) => {
      spinner.style.display = "none";
      msg.innerHTML = '<span class="err">模型加载失败</span><br>' +
        "请检查链接是否正确，以及文件所在服务器是否允许跨域访问（CORS）。" +
        "<br><small>错误信息：" + (error && error.message ? error.message : error) + "</small>";
    }
  );
}

function loadFile(file) {
  const name = file.name;
  msg.innerHTML = "正在加载本地文件…";
  spinner.style.display = "block";
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const loader2 = new GLTFLoader();
      loader2.parse(fr.result, "", (gltf) => {
        setupModel(gltf.scene, name);
        hideOverlay();
      }, (e) => {
        spinner.style.display = "none";
        msg.innerHTML = '<span class="err">文件解析失败</span><br>请确认是 .glb 或 .gltf 格式';
      });
    } catch (e) {
      spinner.style.display = "none";
      msg.innerHTML = '<span class="err">文件解析失败</span>';
    }
  };
  fr.readAsArrayBuffer(file);
}

/* ---------------- 控件 ---------------- */
const slider = document.getElementById("explode");
const explodeVal = document.getElementById("explodeVal");

function updateSliderFill() {
  slider.style.setProperty("--fill", slider.value + "%");
}
slider.addEventListener("input", () => {
  explodeFactor = slider.value / 100;
  explodeVal.textContent = slider.value + "%";
  updateSliderFill();
  applyExplode();
});

document.getElementById("btnReset").addEventListener("click", () => {
  slider.value = 0;
  explodeFactor = 0;
  explodeVal.textContent = "0%";
  updateSliderFill();
  applyExplode();
  if (modelRoot) controls.target.set(0, modelRadius * 0.4, 0);
});

let spinning = false;
const btnSpin = document.getElementById("btnSpin");
btnSpin.addEventListener("click", () => {
  spinning = !spinning;
  btnSpin.classList.toggle("on", spinning);
});

let gridOn = true;
const btnGrid = document.getElementById("btnGrid");
btnGrid.classList.add("on");
btnGrid.addEventListener("click", () => {
  gridOn = !gridOn;
  grid.visible = gridOn;
  btnGrid.classList.toggle("on", gridOn);
});

/* 拖拽本地文件 */
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && /\.(glb|gltf)$/i.test(file.name)) loadFile(file);
});

/* ---------------- 渲染循环 ---------------- */
renderer.setAnimationLoop(() => {
  if (spinning && modelRoot) modelRoot.rotation.y += 0.005;
  controls.update();
  renderer.render(scene, camera);
});

/* ---------------- 入口：?model=参数 ---------------- */
const params = new URLSearchParams(location.search);
const modelUrl = params.get("model");
if (modelUrl) {
  loadURL(modelUrl);
} else {
  spinner.style.display = "none";
  msg.innerHTML = "提示：在网址后加 <b>?model=模型文件地址</b><br>即可自动加载线上 GLB 模型，例如：<br><small>?model=https://xxx.com/model.glb</small>";
}
</script>
</body>
